name: Prepare draft release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate existing release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the dispatched tag and reviewed main ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            printf '%s\n' 'Dispatch this workflow on an existing release tag.' >&2
            exit 1
          fi
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify --end-of-options "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          python3 -m repo_tools.release --check-only --ref HEAD \
            --release-tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA" \
            --main-ref "refs/remotes/origin/$DEFAULT_BRANCH"
  quality:
    name: Full release checks
    needs: validate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
  draft:
    name: Attest artifacts and create a draft
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist
      - name: Verify artifacts and refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh --version
          archive="cgp-certificate-manager-$RELEASE_TAG.tar.gz"
          (cd dist && sha256sum --check --strict "$archive.sha256")
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_state=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){id}}}' \
            -f owner="$owner" -f name="$repository" -f tag="$RELEASE_TAG")
          if ! jq -e '(.errors == null or .errors == []) and (.data.repository | type == "object" and has("release")) and .data.repository.release == null' \
            >/dev/null <<< "$release_state"; then
            printf '%s\n' 'Release preflight refused: an existing release or invalid API response.' >&2
            exit 1
          fi
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq '.sha')
          test "$remote_commit" = "$GITHUB_SHA"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          push-to-registry: false
          create-storage-record: false
      - name: Create the unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_state=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){id}}}' \
            -f owner="$owner" -f name="$repository" -f tag="$RELEASE_TAG")
          if ! jq -e '(.errors == null or .errors == []) and (.data.repository | type == "object" and has("release")) and .data.repository.release == null' \
            >/dev/null <<< "$release_state"; then
            printf '%s\n' 'Release preflight refused: an existing release or invalid API response.' >&2
            exit 1
          fi
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq '.sha')
          test "$remote_commit" = "$GITHUB_SHA"
          release_flags=(--verify-tag --draft --latest=false)
          case "$RELEASE_TAG" in
            *rc[0-9]*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" "${release_flags[@]}" \
            --title "CGP Certificate Manager $RELEASE_TAG" --generate-notes
