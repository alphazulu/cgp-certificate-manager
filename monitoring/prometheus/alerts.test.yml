# Execute with the pinned real Prometheus promtool; Python does not evaluate PromQL.
# The synthetic clock starts at zero. Incrementing timestamp/expiry values keep
# snapshot age and remaining certificate lifetime fixed for threshold tests.
# Each positive case checks the total firing count as well as exact alerts,
# so an unexpected companion alert cannot be silently ignored.
rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: healthy_snapshot_and_legitimate_future_retry
  interval: 1m
  input_series:
  - series: up{cgp_manager="true",instance="mail:9100",job="node"}
    values: 1x60
  - series: cgp_manager_collection_success{cgp_manager="true",instance="mail:9100",job="node"}
    values: 1x60
  - series: cgp_manager_collection_timestamp_seconds{cgp_manager="true",instance="mail:9100",job="node"}
    values: 0+60x60
  - series: cgp_manager_build_info{cgp_manager="true",instance="mail:9100",job="node",version="2.2.0.dev-test"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="config",status="ok"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="inventory",status="ok"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="state",status="ok"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="transactions",status="ok"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="resolutions",status="ok"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="dns_challenges",status="ok"}
    values: 1x60
  - series: cgp_manager_source_status{cgp_manager="true",instance="mail:9100",job="node",source="lock",status="ok"}
    values: 1x60
  - series: cgp_manager_domain_info{cert_name="example.com",cgp_manager="true",domain="example.com",instance="mail:9100",job="node"}
    values: 1x60
  - series: cgp_manager_domain_enabled{cgp_manager="true",domain="example.com",instance="mail:9100",job="node"}
    values: 1x60
  - series: cgp_manager_local_certificate_status{cgp_manager="true",domain="example.com",instance="mail:9100",job="node",status="ok"}
    values: 1x60
  - series: cgp_manager_local_certificate_not_after_timestamp_seconds{cgp_manager="true",domain="example.com",instance="mail:9100",job="node"}
    values: 7776000+60x60
  - series: cgp_manager_recorded_failures{cgp_manager="true",domain="example.com",instance="mail:9100",job="node"}
    values: '0x60'
  - series: cgp_manager_pending_artifacts{cgp_manager="true",instance="mail:9100",job="node",kind="transactions"}
    values: '0x60'
  - series: cgp_manager_pending_artifacts{cgp_manager="true",instance="mail:9100",job="node",kind="resolutions"}
    values: '0x60'
  - series: cgp_manager_pending_artifacts{cgp_manager="true",instance="mail:9100",job="node",kind="dns_challenges"}
    values: '0x60'
  - series: cgp_manager_last_success_timestamp_seconds{cgp_manager="true",domain="example.com",instance="mail:9100",job="node"}
    values: '0x60'
  - series: cgp_manager_retry_timestamp_seconds{cgp_manager="true",domain="example.com",instance="mail:9100",job="node"}
    values: 86400x60
  promql_expr_test:
  - expr: cgp_manager:snapshot_fresh
    eval_time: 30m
    exp_samples:
    - labels: cgp_manager:snapshot_fresh{job="node",instance="mail:9100"}
      value: 1
  - expr: cgp_manager:local_sources_complete
    eval_time: 30m
    exp_samples:
    - labels: cgp_manager:local_sources_complete{job="node",instance="mail:9100"}
      value: 1
  - expr: count(ALERTS{component="cgp-certificate-manager", alertstate="firing"})
    eval_time: 30m
    exp_samples: []
