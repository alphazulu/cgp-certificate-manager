- name: expected_targets_with_absent_or_partial_metadata
  interval: 1m
  input_series:
  - series: up{cgp_manager="true",instance="absent:9100",job="node"}
    values: 1x60
  - series: up{cgp_manager="true",instance="success-only:9100",job="node"}
    values: 1x60
  - series: cgp_manager_collection_success{cgp_manager="true",instance="success-only:9100",job="node"}
    values: '0x60'
  - series: up{cgp_manager="true",instance="timestamp-only:9100",job="node"}
    values: 1x60
  - series: cgp_manager_collection_timestamp_seconds{cgp_manager="true",instance="timestamp-only:9100",job="node"}
    values: 0+60x60
  - series: up{cgp_manager="true",instance="build-only:9100",job="node"}
    values: 1x60
  - series: cgp_manager_build_info{cgp_manager="true",instance="build-only:9100",job="node",version="test"}
    values: 1x60
  alert_rule_test:
  - eval_time: 5m
    alertname: CGPManagerMonitoringMissing
    exp_alerts:
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node
        instance: absent:9100
      exp_annotations:
        summary: Manager collection metadata is missing
        description: The opted-in exporter is reachable but collection success or timestamp metadata is absent.
          Check collection scheduling and textfile publication; absence is not a healthy zero.
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node
        instance: success-only:9100
      exp_annotations:
        summary: Manager collection metadata is missing
        description: The opted-in exporter is reachable but collection success or timestamp metadata is absent.
          Check collection scheduling and textfile publication; absence is not a healthy zero.
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node
        instance: timestamp-only:9100
      exp_annotations:
        summary: Manager collection metadata is missing
        description: The opted-in exporter is reachable but collection success or timestamp metadata is absent.
          Check collection scheduling and textfile publication; absence is not a healthy zero.
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node
        instance: build-only:9100
      exp_annotations:
        summary: Manager collection metadata is missing
        description: The opted-in exporter is reachable but collection success or timestamp metadata is absent.
          Check collection scheduling and textfile publication; absence is not a healthy zero.
  promql_expr_test:
  - expr: ALERTS{component="cgp-certificate-manager", alertstate="firing"}
    eval_time: 4m
    exp_samples: []
  - expr: count(ALERTS{component="cgp-certificate-manager", alertstate="firing"})
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 4
