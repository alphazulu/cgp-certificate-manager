  alert_rule_test:
  - eval_time: 20m
    alertname: CGPManagerCollectionFailed
    exp_alerts:
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node-b
        instance: one:9100
      exp_annotations:
        summary: Manager local collection is incomplete
        description: A fresh snapshot could not collect all required observations. Source and local-certificate
          read alerts identify available causes; this is not proof of a renewal or served TLS failure.
  - eval_time: 20m
    alertname: CGPManagerLocalCertificateExpiryCritical
    exp_alerts:
    - exp_labels:
        component: cgp-certificate-manager
        scope: local_certificate
        severity: critical
        job: node-a
        instance: one:9100
        domain: example.com
      exp_annotations:
        summary: A local certificate expires within seven days or has expired
        description: The enabled domain's readable public local leaf has at most seven days remaining. Verify renewal
          and the separately observed deployed certificate; these metrics do not prove served TLS health.
  - eval_time: 20m
    alertname: CGPManagerMonitoringMissing
    exp_alerts:
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node-c
        instance: two:9100
      exp_annotations:
        summary: Manager collection metadata is missing
        description: The opted-in exporter is reachable but collection success or timestamp metadata is absent.
          Check collection scheduling and textfile publication; absence is not a healthy zero.
  - eval_time: 20m
    alertname: CGPManagerMonitoringStale
    exp_alerts:
    - exp_labels:
        component: cgp-certificate-manager
        scope: observation
        severity: warning
        job: node-a
        instance: two:9100
      exp_annotations:
        summary: Manager local snapshot is stale
        description: The collection timestamp is more than 15 minutes old. Certificate, retained-artifact and saved-result
          alerts are suppressed until a fresh complete snapshot is available.
  promql_expr_test:
  - expr: count(ALERTS{component="cgp-certificate-manager", alertstate="firing"})
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 4
